version: '3.8'

services:
  # Backend Service - Flask API with ML Models
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: urbanform-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      # Persist uploaded documents and models
      - ./backend/data:/app/data
      - ./backend/zoning-documents:/app/zoning-documents
      - ./backend/models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - urbanform-network

  # Frontend Service - Nginx serving React SPA
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: urbanform-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - urbanform-network

networks:
  urbanform-network:
    driver: bridge
